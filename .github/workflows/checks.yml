name: Candidate checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check-release.py .
      - run: python scripts/validate-compose.py
      - name: Check every Bash entry point
        run: |
          for script in setup stack scripts/launcher-common.sh scripts/bootstrap-host.sh scripts/release.sh; do
            bash -n "$script"
          done
      - name: Build and inspect the portable Bash installer
        run: |
          python scripts/build-setup-bundle.py --format shell "$RUNNER_TEMP/samurai-setup.sh"
          bash "$RUNNER_TEMP/samurai-setup.sh" --version
          bash "$RUNNER_TEMP/samurai-setup.sh" --help
      - name: Build audited assets for the actual release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release.sh --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-candidate"
